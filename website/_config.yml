title: Chat Agent Relay
description: >-
  Open-source relay layer between chat platforms and agents.
  Canonical events, governance, routing, delivery reliability, and auditability.
url: https://ChatAgentRelay.github.io
baseurl: /ChatAgentRelay

permalink: /blog/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      extra_css: true
      nav_active: blog
  - scope:
      path: "docs"
    values:
      layout: "doc"
      extra_css: true
      nav_style: docs
      hide_footer: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
