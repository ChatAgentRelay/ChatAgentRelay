<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
{% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
{% if page.noindex %}<meta name="robots" content="noindex">{% endif %}

<!-- Open Graph -->
<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta property="og:title" content="{{ page.og_title | default: page.title | default: site.title }}">
<meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
{% if page.date %}<meta property="article:published_time" content="{{ page.date | date: '%Y-%m-%d' }}">{% endif %}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.twitter_title | default: page.og_title | default: page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.twitter_description | default: page.og_description | default: page.description | default: site.description | strip_html | strip_newlines | truncate: 200 }}">

<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/img/og-card.svg">
<meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/img/og-card.svg">

{% if page.canonical %}<link rel="canonical" href="{{ page.canonical }}">{% else %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
<link rel="icon" href="{{ site.baseurl }}/img/favicon.svg" type="image/svg+xml">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ site.baseurl }}/css/style.css">
{% if page.extra_css %}<link rel="stylesheet" href="{{ site.baseurl }}/css/docs.css">{% endif %}
